# 端到端验证用配置：直接复用已有「鹅腿阿姨」抓取数据，不重新爬取。
project:
  name: "etui_validate"
  topic: "鹅腿阿姨"
  output_dir: "outputs"

crawl:
  enabled: false            # 已有 raw/ 数据，跳过 Step0

clean:
  min_length: 1
  strip_reply_prefix: true
  strip_emote: true
  strip_url: true
  drop_mojibake: true

phases:
  mode: "auto"
  manual: []
  auto:
    start_ratio: 0.10
    peak_ratio: 0.50
    decay_ratio: 0.10
    resurge_ratio: 0.20
    min_gap_days: 2

phrases:
  mode: "auto"
  top_n: 24
  min_len: 2
  heatmap_top: 22

topics:
  mode: "auto"
  explore:
    enabled: true
    sample_size: 12000
    k_range: [4, 9]
    max_features: 8000
    svd_components: 100
  codebook:
    order: []
    categories: {}
    fallback: "F"
    fallback_name: "F无关信息"
    short_to: ""
    short_maxlen: 15

sentiment:
  enabled: true
  engine: "snownlp"
  pos_threshold: 0.6
  neg_threshold: 0.4
  max_chars: 200
  stance:
    enabled: false
    pos_name: "支持/采信"
    neg_name: "质疑/反对"
    pos_words: []
    neg_words: []

network:
  enabled: true
  top_videos: 10
  viz_min_degree: 3
  viz_max_nodes: 8000
  path_sample: 300
  cooccur_min: 30
  export_gexf: true

bert:
  enabled: false

report:
  html: true
  docx: false
  title: ""

runtime:
  font: ""
  random_seed: 42
  figure_dpi: 150
